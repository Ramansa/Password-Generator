<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar and slider styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981; /* Emerald 500 */
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155; /* Slate 700 */
            border-radius: 9999px;
        }
        
        .toast-enter {
            opacity: 1;
            transform: translateY(0);
        }
        .toast-exit {
            opacity: 0;
            transform: translateY(-20px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen p-4 font-sans selection:bg-emerald-500 selection:text-white">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full shadow-lg font-medium transition-all duration-300 pointer-events-none z-50 toast-exit">
        Copied to clipboard!
    </div>

    <!-- Main Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 md:p-8 w-full max-w-lg relative overflow-hidden">
        
        <!-- Background Glow -->
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-[120%] h-32 bg-emerald-500/10 blur-3xl rounded-full pointer-events-none"></div>

        <h1 class="text-2xl font-bold mb-6 text-center text-white flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Password Generator
        </h1>

        <!-- Password Display Area -->
        <div class="bg-slate-950/50 border border-slate-700/50 rounded-2xl p-4 mb-6 relative group hover:border-emerald-500/50 transition-colors">
            <div id="password-display" class="text-3xl font-mono text-center text-emerald-400 break-all min-h-[48px] flex items-center justify-center tracking-wider">
                Generating...
            </div>
            
            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 flex gap-2">
                <button onclick="copyPassword()" class="p-2 bg-slate-800 hover:bg-emerald-600 rounded-lg text-slate-300 hover:text-white transition-all group-hover:opacity-100 opacity-70" title="Copy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
                <button onclick="generatePassword()" class="p-2 bg-slate-800 hover:bg-emerald-600 rounded-lg text-slate-300 hover:text-white transition-all group-hover:opacity-100 opacity-70" title="Refresh">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </div>

        <!-- Strength Indicator -->
        <div class="mb-6">
            <div class="flex justify-between text-xs font-medium text-slate-400 mb-2">
                <span>Strength</span>
                <span id="strength-text" class="text-emerald-500 uppercase tracking-wide">Strong</span>
            </div>
            <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden flex gap-1">
                <div id="strength-bar-1" class="h-full flex-1 bg-emerald-500 rounded-full transition-all"></div>
                <div id="strength-bar-2" class="h-full flex-1 bg-emerald-500 rounded-full transition-all"></div>
                <div id="strength-bar-3" class="h-full flex-1 bg-emerald-500 rounded-full transition-all"></div>
                <div id="strength-bar-4" class="h-full flex-1 bg-emerald-500 rounded-full transition-all"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-6">
            
            <!-- Suggestion Word Input -->
            <div class="space-y-2">
                <label for="baseWord" class="block text-sm font-medium text-slate-300">Base Word (Optional)</label>
                <input type="text" id="baseWord" placeholder="e.g. apple, mydog, secret" 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-slate-600">
                <p class="text-xs text-slate-500">We'll translate this into a strong password based on your rules below.</p>
            </div>

            <!-- Length Slider -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-slate-300">Password Length</label>
                    <input type="number" id="length-num" min="4" max="64" value="16" class="bg-slate-950 border border-slate-700 rounded-lg w-16 px-2 py-1 text-center text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <input type="range" id="length-slider" min="4" max="64" value="16" class="w-full appearance-none bg-transparent">
            </div>

            <!-- Checkboxes / Rules Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                
                <label class="flex items-center space-x-3 cursor-pointer group">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" id="upper" checked class="peer sr-only">
                        <div class="w-5 h-5 bg-slate-800 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all"></div>
                        <svg class="absolute w-3 h-3 text-slate-900 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Uppercase (A-Z)</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer group">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" id="lower" checked class="peer sr-only">
                        <div class="w-5 h-5 bg-slate-800 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all"></div>
                        <svg class="absolute w-3 h-3 text-slate-900 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Lowercase (a-z)</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer group">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" id="numbers" checked class="peer sr-only">
                        <div class="w-5 h-5 bg-slate-800 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all"></div>
                        <svg class="absolute w-3 h-3 text-slate-900 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Numbers (0-9)</span>
                </label>

                <label class="flex items-center space-x-3 cursor-pointer group">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" id="symbols" checked class="peer sr-only">
                        <div class="w-5 h-5 bg-slate-800 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all"></div>
                        <svg class="absolute w-3 h-3 text-slate-900 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Symbols (!@#$)</span>
                </label>
                
                <div class="col-span-1 sm:col-span-2 mt-2 pt-4 border-t border-slate-800">
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" id="vowels" checked class="peer sr-only">
                            <div class="w-5 h-5 bg-slate-800 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all"></div>
                            <svg class="absolute w-3 h-3 text-slate-900 opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Include Vowels (A, E, I, O, U)</span>
                            <span class="text-xs text-slate-500">Uncheck to remove vowels (except when mapped to numbers/symbols)</span>
                        </div>
                    </label>
                </div>

            </div>
            
            <button onclick="generatePassword()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-emerald-900/20 active:scale-[0.98] flex items-center justify-center gap-2">
                Generate Password
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const passwordDisplay = document.getElementById('password-display');
        const lengthSlider = document.getElementById('length-slider');
        const lengthNum = document.getElementById('length-num');
        const baseWordInput = document.getElementById('baseWord');
        const toast = document.getElementById('toast');
        
        // Settings Checkboxes
        const settings = {
            upper: document.getElementById('upper'),
            lower: document.getElementById('lower'),
            numbers: document.getElementById('numbers'),
            symbols: document.getElementById('symbols'),
            vowels: document.getElementById('vowels')
        };

        // Sync slider and number input
        lengthSlider.addEventListener('input', (e) => {
            lengthNum.value = e.target.value;
            generatePassword();
        });
        
        lengthNum.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (val > 64) val = 64;
            if (val < 4) val = 4;
            lengthSlider.value = val;
            generatePassword();
        });

        // Add auto-generate listeners to all inputs
        Object.values(settings).forEach(checkbox => {
            checkbox.addEventListener('change', generatePassword);
        });
        baseWordInput.addEventListener('input', generatePassword);

        // Core Generation Logic
        function generatePassword() {
            const length = parseInt(lengthSlider.value) || 16;
            const useUpper = settings.upper.checked;
            const useLower = settings.lower.checked;
            const useNumbers = settings.numbers.checked;
            const useSymbols = settings.symbols.checked;
            const useVowels = settings.vowels.checked;
            const baseWord = baseWordInput.value.trim();

            if (!useUpper && !useLower && !useNumbers && !useSymbols) {
                showToast("Select at least one character type!", true);
                passwordDisplay.innerText = "Error";
                passwordDisplay.classList.replace('text-emerald-400', 'text-red-500');
                updateStrengthBar(0);
                return;
            }
            passwordDisplay.classList.replace('text-red-500', 'text-emerald-400');

            // Character Sets
            let upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let lowerChars = "abcdefghijklmnopqrstuvwxyz";
            
            if (!useVowels) {
                upperChars = upperChars.replace(/[AEIOU]/g, '');
                lowerChars = lowerChars.replace(/[aeiou]/g, '');
            }
            
            const numChars = "0123456789";
            const symChars = "!@#$%^&*()_+~|}{[]:;?><,./-=";

            let allowed = "";
            let requiredPools = [];
            
            if (useUpper && upperChars) { allowed += upperChars; requiredPools.push(upperChars); }
            if (useLower && lowerChars) { allowed += lowerChars; requiredPools.push(lowerChars); }
            if (useNumbers) { allowed += numChars; requiredPools.push(numChars); }
            if (useSymbols) { allowed += symChars; requiredPools.push(symChars); }

            let password = "";

            if (baseWord) {
                // Mode 1: Translate Suggestion Word (Leetspeak rules applied)
                let translated = "";
                
                for (let i = 0; i < baseWord.length; i++) {
                    let char = baseWord[i];
                    let lowerChar = char.toLowerCase();
                    let isVowel = "aeiou".includes(lowerChar);
                    
                    let mappedChar = char;
                    let mapped = false;

                    // 1. Try to map to a symbol if allowed
                    if (useSymbols) {
                        const symMap = { 'a': '@', 's': '$', 'i': '!', 'l': '!' };
                        if (symMap[lowerChar]) {
                            mappedChar = symMap[lowerChar];
                            mapped = true;
                        }
                    }

                    // 2. Try to map to a number if allowed (and not already mapped to symbol)
                    if (!mapped && useNumbers) {
                        const numMap = { 'a': '4', 'e': '3', 'i': '1', 'o': '0', 's': '5', 't': '7', 'b': '8', 'g': '9', 'l': '1' };
                        if (numMap[lowerChar]) {
                            mappedChar = numMap[lowerChar];
                            mapped = true;
                        }
                    }

                    // 3. Handle unmapped letters (Case rules + Vowel stripping)
                    if (!mapped) {
                        if (isVowel && !useVowels) {
                            continue; // Skip the vowel completely
                        }
                        
                        // Force cases based on rules
                        if (useUpper && !useLower) {
                            mappedChar = char.toUpperCase();
                        } else if (useLower && !useUpper) {
                            mappedChar = char.toLowerCase();
                        } else if (!useUpper && !useLower) {
                            // If neither letters are allowed, and it couldn't map to a num/sym, skip it
                            continue; 
                        } else {
                            // Both allowed, randomize capitalization to make it strong
                            mappedChar = Math.random() > 0.5 ? char.toUpperCase() : char.toLowerCase();
                        }
                    }

                    translated += mappedChar;
                }

                // Add Padding / Fill Missing Pools / Truncate
                if (translated.length < length) {
                    // Identify what required pools are missing from the translated word
                    let missingPools = requiredPools.filter(pool => {
                        for (let c of translated) {
                            if (pool.includes(c)) return false;
                        }
                        return true;
                    });

                    let padding = "";
                    
                    // Add characters from missing pools
                    for (let pool of missingPools) {
                        if (translated.length + padding.length < length) {
                            padding += pool[Math.floor(Math.random() * pool.length)];
                        }
                    }

                    // Fill the rest with entirely random allowed characters
                    while ((translated.length + padding.length) < length) {
                        padding += allowed[Math.floor(Math.random() * allowed.length)];
                    }

                    // Shuffle the padding so the base word remains intact at the front
                    padding = padding.split('').sort(() => 0.5 - Math.random()).join('');
                    password = translated + padding;
                    
                } else if (translated.length > length) {
                    // Base word was too long, truncate it
                    password = translated.substring(0, length);
                } else {
                    password = translated;
                }

                // Final safety check: if we truncated or word missed requirements, force them into the end
                password = enforceRequiredPools(password, length, requiredPools);

            } else {
                // Mode 2: Completely Random Generation
                let tempPass = [];
                
                // Guarantee at least one character from each selected requirement
                requiredPools.forEach(pool => {
                    tempPass.push(pool[Math.floor(Math.random() * pool.length)]);
                });

                // Fill the rest
                while (tempPass.length < length) {
                    tempPass.push(allowed[Math.floor(Math.random() * allowed.length)]);
                }

                // Shuffle completely
                password = tempPass.sort(() => 0.5 - Math.random()).join('');
            }

            passwordDisplay.innerText = password;
            calculateStrength(password);
        }

        // Helper to ensure password contains at least one char of all required types
        function enforceRequiredPools(pass, targetLen, pools) {
            let pArr = pass.split('');
            let missingPools = pools.filter(pool => {
                return !pArr.some(c => pool.includes(c));
            });
            
            // If we have missing requirements, overwrite characters starting from the end
            for (let i = 0; i < missingPools.length; i++) {
                if (pArr.length > 0) {
                    pArr[pArr.length - 1 - i] = missingPools[i][Math.floor(Math.random() * missingPools[i].length)];
                }
            }
            return pArr.join('');
        }

        // Strength Calculation UI
        function calculateStrength(password) {
            let score = 0;
            if (password.length > 7) score += 1;
            if (password.length > 12) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;

            let strengthValue = 0; // 0 to 4
            
            if (score <= 2) strengthValue = 1; // Weak
            else if (score === 3 || score === 4) strengthValue = 2; // Fair
            else if (score === 5 && password.length < 12) strengthValue = 3; // Good
            else if (score >= 4 && password.length >= 12) strengthValue = 4; // Strong

            updateStrengthBar(strengthValue);
        }

        function updateStrengthBar(level) {
            const bars = [
                document.getElementById('strength-bar-1'),
                document.getElementById('strength-bar-2'),
                document.getElementById('strength-bar-3'),
                document.getElementById('strength-bar-4')
            ];
            const text = document.getElementById('strength-text');
            
            // Reset all
            bars.forEach(b => {
                b.className = 'h-full flex-1 rounded-full transition-all bg-slate-800';
            });

            // Set colors based on level
            const colors = ['bg-red-500', 'bg-orange-400', 'bg-blue-400', 'bg-emerald-500'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];

            if (level > 0) {
                text.innerText = labels[level - 1];
                text.className = `uppercase tracking-wide text-xs font-bold ${colors[level - 1].replace('bg-', 'text-')}`;
                
                for (let i = 0; i < level; i++) {
                    bars[i].className = `h-full flex-1 rounded-full transition-all ${colors[level - 1]}`;
                }
            } else {
                text.innerText = '';
            }
        }

        // Copy functionality
        function copyPassword() {
            const text = passwordDisplay.innerText;
            if (text === "Error" || text === "Generating...") return;

            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
            }).catch(err => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                showToast("Copied to clipboard!");
            });
        }

        // Custom Toast UI (No alerts)
        let toastTimeout;
        function showToast(message, isError = false) {
            toast.innerText = message;
            
            if(isError) {
                toast.classList.replace('bg-emerald-500', 'bg-red-500');
            } else {
                toast.classList.replace('bg-red-500', 'bg-emerald-500');
            }

            toast.classList.remove('toast-exit');
            toast.classList.add('toast-enter');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
            }, 2500);
        }

        // Initialization: Generate password on page load
        document.addEventListener('DOMContentLoaded', generatePassword);

    </script>
</body>
</html>
